syntax = "proto3";

package payment.v1;

option go_package = "proto/payment/v1;paymentv1";

service PaymentService {
  rpc GetPaymentByOrderID(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
}

message Payment {
  int64 id = 1;
  int64 order_id = 2;
  int64 user_id = 3;
  double amount = 4;
  string status = 5;
  string payment_method = 6;
  string transaction_id = 7;
  string created_at = 8;
  string updated_at = 9;
}

message GetPaymentRequest {
  int64 order_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ProcessPaymentRequest {
  int64 order_id = 1;
  int64 user_id = 2;
  double amount = 3;
  string payment_method = 4;
}

message ProcessPaymentResponse {
  Payment payment = 1;
}
