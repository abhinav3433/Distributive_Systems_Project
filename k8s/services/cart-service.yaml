apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: distributed-ecommerce
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: distributed_ecommerce-cart-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9093
              name: grpc
          env:
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: REDIS_ADDR
            - name: PORT
              value: "8083"
            - name: GRPC_PORT
              value: "9093"
            - name: GIN_MODE
              value: "release"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: distributed-ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: grpc
      port: 9093
      targetPort: 9093
  selector:
    app: cart-service
