services:
  # ==========================================
  # DATABASES & INFRASTRUCTURE
  # ==========================================
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./services/auth-service/migrations/001_create_users_table.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-product:
    image: postgres:15-alpine
    container_name: postgres-product
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
      - ./services/product-service/migrations/001_create_products_table.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./services/order-service/migrations/001_create_orders_table.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
      - ./services/payment-service/migrations/001_create_payments_table.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # BACKEND MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service
    environment:
      DB_HOST: postgres-auth
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: auth_db
      JWT_SECRET: super-secret-jwt-key
      PORT: "8081"
      GRPC_PORT: "9091"
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    container_name: product-service
    environment:
      DB_HOST: postgres-product
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: product_db
      PORT: "8082"
      GRPC_PORT: "9092"
    depends_on:
      postgres-product:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build:
      context: .
      dockerfile: ./services/cart-service/Dockerfile
    container_name: cart-service
    environment:
      REDIS_ADDR: redis:6379
      PORT: "8083"
      GRPC_PORT: "9093"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: order-service
    environment:
      DB_HOST: postgres-order
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: order_db
      PRODUCT_SERVICE_URL: http://product-service:8082
      PRODUCT_SERVICE_GRPC_ADDR: product-service:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: "8084"
      GRPC_PORT: "9094"
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: payment-service
    environment:
      DB_HOST: postgres-payment
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: "8085"
      GRPC_PORT: "9095"
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # API GATEWAY
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      AUTH_SERVICE_GRPC_ADDR: auth-service:9091
      PRODUCT_SERVICE_GRPC_ADDR: product-service:9092
      CART_SERVICE_GRPC_ADDR: cart-service:9093
      ORDER_SERVICE_GRPC_ADDR: order-service:9094
      PAYMENT_SERVICE_GRPC_ADDR: payment-service:9095
      PORT: "8080"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
    restart: unless-stopped

  # ==========================================
  # REACT FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  postgres_auth_data:
  postgres_product_data:
  postgres_order_data:
  postgres_payment_data:
  redis_data:
  rabbitmq_data:
